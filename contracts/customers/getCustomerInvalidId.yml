name: get customer with invalid id
description: A customer ID that is not an integer is rejected, which is reported as RFC 9457 problem details.
request:
  method: GET
  url: /customers/abc
  headers:
    Accept: application/json
response:
  status: 400
  headers:
    Content-Type: application/problem+json
  body:
    title: Invalid customer ID
    status: 400
  matchers:
    headers:
      - key: Content-Type
        regex: 'application/problem\+json.*'
